name: test
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly deep run: ~10× more random inputs
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]' uharfbuzz
      - run: varness doctor
      - run: pytest -q                      # Hypothesis profile "ci"
      - run: varness check assets/varness.svg assets/varness-small.svg --strict   # the project logo stays ship-ready
      - if: github.event_name == 'schedule'
        run: VARNESS_TEST_PROFILE=deep pytest -q
